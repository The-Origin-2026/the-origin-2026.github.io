<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Successful - The Memory We Lost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      text-align: center;
      background: #1c1c1c;
      padding: 45px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #fff;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 30px;
    }

    p {
      color: #ccc;
      line-height: 1.7;
      font-size: 16px;
    }

    .book {
      margin: 25px 0;
      padding: 18px;
      border: 1px solid #444;
      border-radius: 10px;
    }

    .book-title {
      font-size: 20px;
      color: #fff;
      margin-bottom: 8px;
    }

    .status {
      margin-top: 25px;
      color: #aaa;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .download-button {
      display: none;
      margin-top: 25px;
      padding: 14px 25px;
      background: #fff;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-weight: bold;
    }

    .download-button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="check">✓</div>

    <h1>Payment Successful</h1>

    <p>
      Thank you for purchasing <strong>The Memory We Lost</strong>.
    </p>

    <div class="book">
      <div class="book-title">
        The Memory We Lost
      </div>

      <p>
        Complete Novel — PDF
      </p>
    </div>

    <p>
      Your payment has been received successfully.
    </p>

    <div class="status">
      Preparing your secure download...
    </div>

    <a id="downloadButton"
       class="download-button"
       href="#">
       Download Your Novel
    </a>

  </div>

</body>
</html>
